name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu
    uses: ./.github/workflows/check.yml
    with:
      os: ubuntu-latest
      vitest-shards: '[1, 2]'
      e2e-shards: '[1, 2]'
      docker: true

  macos:
    name: macOS
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: ./.github/workflows/check.yml
    with:
      os: macos-latest
      vitest-shards: '[1, 2]'
      e2e-shards: '[1, 2]'

  windows:
    name: Windows
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: ./.github/workflows/check.yml
    with:
      os: windows-latest
      vitest-shards: '[1, 2, 3, 4]'
      e2e-shards: '[1, 2]'

  hook-targets:
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        working-directory: packages/hook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/hook/go.mod
          cache: false
      - run: go vet ./...
      - run: go build -trimpath -o "$RUNNER_TEMP/aang-hook-$GOOS-$GOARCH/" ./cmd/aang-hook
